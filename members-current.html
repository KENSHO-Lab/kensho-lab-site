<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>現役生 | KENSHO Lab</title>
  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.18);
      --shadow: 0 18px 60px rgba(0,0,0,0.25);
    }
    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      /* 現役生ページは少しだけ色味を変えて（青みを強くして）差別化しています */
      background: radial-gradient(circle at 20% 10%, rgba(62,166,255,0.18), rgba(11,18,32,1) 60%);
      color:#fff;
      overflow-x:hidden;
    }

    /* ===== 固定ヘッダー（共通） ===== */
    .topbar{
      position: sticky;
      top: 12px;
      width: min(1100px, 92vw);
      margin: 12px auto 0;
      z-index: 50;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:10px; padding-left: 6px;
      color:#fff; text-decoration:none; font-weight:800; letter-spacing:.04em;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:#3ea6ff;
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }
    .nav{ display:flex; gap: 8px; flex-wrap: wrap; justify-content:flex-end; }
    .nav a{
      text-decoration:none; color:#fff; font-weight:700; font-size: 14px;
      padding: 10px 12px; border-radius: 999px; transition:.2s;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }

    /* ===== メインコンテンツ ===== */
    .wrap{
      width: min(1100px, 92vw);
      margin: 18px auto 40px;
    }
    .kicker{
      opacity:.85; letter-spacing:.10em; font-weight:700; font-size: 13px;
    }
    h1{
      margin: 10px 0 14px;
      font-size: clamp(28px, 4.0vw, 44px);
      letter-spacing: .04em;
    }

    /* グリッドレイアウト */
    .grid{
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    @media (max-width: 1100px){ .grid{ grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 820px){ .grid{ grid-template-columns: repeat(2, 1fr); } }

    .card{
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow:hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.20);
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-5px); }

    .photo{
      aspect-ratio: 4/5;
      background: rgba(255,255,255,0.08);
      background-size: cover;
      background-position: center;
    }
    .meta{
      padding: 10px 12px 12px;
      line-height: 1.55;
    }
    .name{
      font-weight: 900;
      letter-spacing: .04em;
      margin: 0 0 4px;
      font-size: 15px;
    }
    .line{ margin: 0; opacity: .88; font-size: 12.5px; }
    .tag{ opacity:.95; font-weight:700; }

  </style>
</head>

<body>
  <!-- 固定ヘッダー -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>KENSHO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="members.html">Lab Members</a>
      <a href="gallery.html">Gallery</a>
      <a href="news.html">News</a>
      <a href="access.html">Access</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="kicker">LAB MEMBERS</div>
    <h1>現役生</h1>

    <section class="grid" aria-label="Members grid">
      
      <!-- メンバー1人分（適宜コピーして増やしてください） -->
      <article class="card">
        <div class="photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png');"></div>
        <div class="meta">
          <p class="name">現役生 メンバー01</p>
          <p class="line"><span class="tag">学年：</span>学部4年</p>
          <p class="line"><span class="tag">研究：</span>デジタルツインの構築</p>
          <p class="line"><span class="tag">趣味：</span>ドライブ</p>
        </div>
      </article>

      <article class="card">
        <div class="photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png');"></div>
        <div class="meta">
          <p class="name">現役生 メンバー02</p>
          <p class="line"><span class="tag">学年：</span>学部4年</p>
          <p class="line"><span class="tag">研究：</span>点群データ解析</p>
          <p class="line"><span class="tag">趣味：</span>キャンプ</p>
        </div>
      </article>

      <!-- 以降、必要人数分 article を追加 -->

    </section>
  </main>
</body>
</html>
