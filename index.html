<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KENSHO Lab</title>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #0b1220;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ===== 動画背景 ===== */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(40%);
    }

    .hero-content {
      z-index: 1;
    }

    h1 {
      font-size: 64px;
      margin: 0;
      letter-spacing: 2px;
    }

    h2 {
      font-weight: 400;
      margin-top: 20px;
      font-size: 24px;
    }

    .button {
      margin-top: 30px;
      padding: 12px 24px;
      border: 1px solid white;
      border-radius: 8px;
      display: inline-block;
      text-decoration: none;
      color: white;
    }

    .button:hover {
      background: rgba(255,255,255,0.2);
    }

    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section-title {
      font-size: 32px;
      margin-bottom: 20px;
      border-left: 4px solid #3ea6ff;
      padding-left: 12px;
    }

    .logo{
      width: min(520px, 78vw);
      height: auto;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 10px 40px rgba(0,0,0,.45));
    }

    /* ロゴ＋文字の“白い帯”（透明） */
    .hero-band{
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;

      padding: 22px 28px;
      border-radius: 18px;

    /* 白帯の透明度（好みで 0.25〜0.55） */
    background: rgba(255,255,255,0.38);

    /* 背景動画を少し見せつつ読みやすくする */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.30);
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
    }

  /* ロゴを“もう少し大きく” */
  .logo{
      width: min(680px, 86vw);   /* ←大きさはここで調整 */
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 40px rgba(0,0,0,.45));
    }

  /* AI×… の文字 */
  .tagline{
      color: #0b1220; /* 白帯の上なので濃い色 */
      font-size: clamp(16px, 2.2vw, 24px);
      letter-spacing: 0.08em;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.25);
    }

  /* ボタン（白帯の上で映えるように濃色に上書き） */
  .button{
      margin-top: 6px;
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
      text-decoration: none;

      background: rgba(11,18,32,0.88);
      color: #ffffff;
      border: 1px solid rgba(11,18,32,0.25);
    }
  .button:hover{
      background: rgba(11,18,32,0.98);
    }
  </style>
</head>

<body>

  <!-- ===== トップ動画セクション ===== -->
  <div class="hero">
    <video autoplay muted loop>
      <source src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E6%B1%A0%E9%96%93%E5%A4%A7%E6%A9%8B.mp4" type="video/mp4">
    </video>

<div class="hero-content">
  <div class="hero-band">
    <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E7%A0%94%E7%A9%B6%E5%AE%A4%E3%83%AD%E3%82%B4.png" alt="KENSHO Lab" class="logo">
    <div class="tagline">AI × 橋梁工学 × 建設DX</div>
    <a href="#industry" class="button">共同研究のご相談</a>
  </div>
</div>

  <!-- ===== 研究内容 ===== -->
  <section>
    <div class="section-title">Research</div>
    <p>
      橋梁劣化診断AI、画像解析、構造ヘルスモニタリング、点群解析など、
      社会インフラを高度化するための知能化研究を推進しています。
    </p>
  </section>

  <!-- ===== 産学連携 ===== -->
  <section id="industry">
    <div class="section-title">Industry Collaboration</div>
    <p>
      KENSHO Labは、橋梁分野におけるAI技術の社会実装を目指し、
      企業・自治体との共同研究を積極的に推進しています。
      共同研究・受託研究・技術相談を歓迎いたします。
    </p>
  </section>

</body>
</html>
