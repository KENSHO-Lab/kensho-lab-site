<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KENSHO Lab</title>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #0b1220;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ===== 動画背景 ===== */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(100%);
    }

    .hero-content {
      z-index: 1;
    }

    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section-title {
      font-size: 32px;
      margin-bottom: 20px;
      border-left: 4px solid #3ea6ff;
      padding-left: 12px;
    }

    /* ロゴ＋文字の“白い帯”（透明） */
    .hero-band{
      width: min(1000px, 92vw);
      padding: 40px 40px;
      border-radius: 22px;
    
      background: rgba(255,255,255,0.12);  /* 少し薄く */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 20px 70px rgba(0,0,0,0.35);
    }
    
    .logo{
      width: min(680px, 86vw);
      height: auto;
      display: block;
      margin: 0 auto 6px;   /* ←ロゴ下の余白を小さくする */
      filter: drop-shadow(0 10px 40px rgba(0,0,0,.45));
    }

    .center-layout{
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    
    .main-nav{
      display:flex;
      gap: 10px;
      margin: 16px 0 8px 0;
      padding: 8px;
      border-radius: 999px;
      background: rgba(11,18,32,0.10);
      border: 1px solid rgba(11,18,32,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    
    .main-nav a{
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration:none;
      color:#0b1220;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
      transition: 0.25s;
    }
    
    .main-nav a:hover{
      background: rgba(255,255,255,0.55);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
      transform: translateY(-1px);
    }

  /* ボタン（白帯の上で映えるように濃色に上書き） */
  .button{
      margin-top: 6px;
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
      text-decoration: none;

      background: rgba(11,18,32,0.88);
      color: #ffffff;
      border: 1px solid rgba(11,18,32,0.25);
    }
  .button:hover{
      background: rgba(11,18,32,0.98);
    }

    .university{
      margin-top: 0;
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #0b1220;
    }
    
    .catchcopy{
      margin-top: 2px;
      font-size: clamp(22px, 3.5vw, 36px);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #0b1220;
    }

    @media (max-width: 640px){
      .main-nav{
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 18px;
      }
    }    

  </style>
</head>

<body>

  <!-- ===== トップ動画セクション ===== -->
  <div class="hero">
    <video autoplay muted loop>
      <source src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E6%B1%A0%E9%96%93%E5%A4%A7%E6%A9%8B.mp4" type="video/mp4">
    </video>

<div class="hero-content">
  <div class="hero-band center-layout">

    <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E7%A0%94%E7%A9%B6%E5%AE%A4%E3%83%AD%E3%82%B43.png" alt="KENSHO Lab" class="logo">

<div class="university">
  国士舘大学 建設DX研究室
</div>

<div class="catchcopy">
  橋を、知能で進化させる。
</div>

    <nav class="main-nav">
      <a href="research.html">Research</a>
      <a href="members.html">Lab Members</a>
      <a href="#gallery">Gallery</a>
      <a href="#news">News</a>
      <a href="#access">Access</a>
    </nav>

    <a href="#industry" class="button">共同研究のご相談</a>

  </div>
</div>

</body>
</html>
