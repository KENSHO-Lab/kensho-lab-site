<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国士舘大学 建設DX研究室 (平尾研究室 Hirao Lab)</title>

  <meta name="description" content="国士舘大学 建設DX研究室 (平尾研究室)の公式サイト。橋梁・インフラ構造物を対象に、AI、画像解析、3Dモデルなどを活用した建設DXの研究・開発を行っています。">

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #0b1220;
      color: #ffffff;
      overflow: hidden; /* PC・スマホともにスクロールなし */
    }

    /* ===== 動画背景 ===== */
    .hero {
      position: relative;
      height: 100dvh;
      display: flex;
      align-items: flex-end;      /* 下に配置 */
      justify-content: center;
      text-align: center;
      padding-bottom: 75px;       /* 下端から少し余白 */
      box-sizing: border-box;
      overflow: hidden;
    }

    .hero video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -1;
      filter: brightness(100%);
    }

    .hero-content {
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* ロゴ＋文字の“白い帯”（透明） */
    .hero-band{
      width: min(680px, 88vw); /* 幅を少し広げて安定させました */
      padding: 40px 30px;
      border-radius: 22px;
    
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 20px 70px rgba(0,0,0,0.35);
    }

    /* ロゴとテキストを横に並べるコンテナ */
    .brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row; /* パソコンでは確実に横並び */
      gap: 24px;
      margin-bottom: 20px;
    }
    
    .k-logo {
      width: clamp(80px, 12vw, 130px);
      height: auto;
      filter: drop-shadow(0 8px 25px rgba(0,0,0,0.2));
      flex-shrink: 0; /* ロゴが潰れないように固定 */
    }

    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .university {
      margin: 0;
      font-size: clamp(22px, 3.6vw, 38px);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #b02127; /* 深い赤色 */
      line-height: 1.2;
      /* 黒い縁取りを追加 */
      text-shadow: 
        1px 1px 0 #000, -1px 1px 0 #000, 
        1px -1px 0 #000, -1px -1px 0 #000,
        0px 1px 0 #000, 0px -1px 0 #000,
        1px 0px 0 #000, -1px 0px 0 #000;
    }
    
    .catchcopy {
      margin-top: 6px;
      font-size: clamp(18px, 2.8vw, 28px);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #0b1220;
      opacity: 0.9;
    }

    .center-layout{
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    
    /* ナビゲーション */
    .main-nav{
      display:flex;
      gap: 10px;
      margin: 10px 0 12px 0;
      padding: 8px;
      border-radius: 999px;
      background: rgba(11,18,32,0.10);
      border: 1px solid rgba(11,18,32,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    
    .main-nav a{
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration:none;
      color:#0b1220;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
      transition: 0.25s;
    }
    
    .main-nav a:hover{
      background: rgba(255,255,255,0.55);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
      transform: translateY(-1px);
    }

    /* ホーム画面メッセージ */
    .home-message {
      margin-top: 18px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #0b1220;
      text-align: center;
      line-height: 1.8;
    }

    .highlight-red {
      color: #b02127; /* 国士舘大学を意識した深い赤 */
      font-weight: 900;
    }

    /* スマホだけ改行 */
    .sp-br {
      display: none;
    }

    .seo-intro {
      margin-top: 16px;
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.8;
      color: #0b1220;
      text-align: center;
    }

    /* PCとスマホの表示切り替え */
    .pc-only {
      display: block;
    }
    
    .sp-only {
      display: none;
    }

    .pc-br {
      display: inline;
    }

    /* ===== スマホ対応の設定 ===== */
    @media (max-width: 640px) {
      .sp-br {
        display: block;
      }
    
      .hero {
        height: 100dvh;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 18px;
      }

      .hero-content {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }

      .brand-container {
        flex-direction: column; /* スマホの時だけ縦並び */
        text-align: center;
        gap: 8px;
      }
      .university {
        font-size: clamp(18px, 5vw, 24px);
        line-height: 1.05;
      }

      .catchcopy {
        margin-top: 2px;
        font-size: clamp(14px, 3.8vw, 18px);
        line-height: 1.15;
        letter-spacing: 0.05em;
      }

      .home-message {
        font-size: clamp(13px, 3.8vw, 16px);
        line-height: 1.35;
        margin-top: 10px;
      }
      .hero-band{
        width: min(92vw, 560px);
        padding: 22px 18px;   /* 縦方向を小さく */
        border-radius: 18px;
      }

      .main-nav{
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 18px;
        margin: 6px 0 8px 0;
        padding: 6px;
        gap: 6px;
      }

      .hero video {
        object-fit: cover;
        object-position: center center;
      }

      .drone{
        width: 60px;
        max-width: 18vw;
        top: 12%;
        left: 6%;
        animation: fly-mobile 16s ease-in-out infinite;
        opacity: 0.85;
      }

      .pc-only {
        display: none;
      }
    
      .sp-only {
        display: block;
      }

      .pc-br {
        display: none;
      }
      
        /* スマホはフォント小さく */
        .seo-intro {
          font-size: clamp(11px, 3.2vw, 13px);
          line-height: 1.4;
          margin-top: 8px;
        }
      }

      /* ===== ドローン ===== */
      .drone{
        position: absolute;
        width: 200px;
        z-index: 0;
        pointer-events: none;
        top: 18%;
        left: 12%;
        animation: fly 20s ease-in-out infinite;
        filter: drop-shadow(0 14px 16px rgba(0,0,0,0.35));
        opacity: 0.95;
      }

      @keyframes fly {
        0%   { transform: translate(0,0) rotate(0deg); }
        18%  { transform: translate(180px,-20px) rotate(6deg); }
        36%  { transform: translate(420px,30px) rotate(-4deg); }
        54%  { transform: translate(680px,-10px) rotate(7deg); }
        72%  { transform: translate(520px,60px) rotate(-6deg); }
        88%  { transform: translate(240px,15px) rotate(4deg); }
        100% { transform: translate(0,0) rotate(0deg); }
      }

      @keyframes fly-mobile {
        0%   { transform: translate(0,0) rotate(0deg); }
        20%  { transform: translate(10vw,-2vh) rotate(5deg); }
        40%  { transform: translate(20vw,2vh) rotate(-4deg); }
        60%  { transform: translate(28vw,-1vh) rotate(6deg); }
        80%  { transform: translate(16vw,3vh) rotate(-5deg); }
        100% { transform: translate(0,0) rotate(0deg); }
      }

  </style>
</head>

<body>

  <div class="hero">
    <video autoplay muted loop playsinline>
      <source src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E6%B1%A0%E9%96%93%E5%A4%A7%E6%A9%8B.mp4" type="video/mp4">
    </video>

<img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/drone1.png" class="drone">

<div class="hero-content">
      <div class="hero-band center-layout">

        <!-- ロゴとテキストの横並びエリア -->
        <div class="brand-container">
          <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E7%A0%94%E7%A9%B6%E5%AE%A4%E3%83%AD%E3%82%B4_%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB2.png" alt="K Logo" class="k-logo">
          
          <div class="text-group">
            <h1 class="university">国士舘大学 建設DX研究室</h1>
            <div class="catchcopy">橋を、知能で進化させる。</div>
          </div>
        </div>

        <nav class="main-nav">
          <a href="research.html">Research</a>
          <a href="members.html">Lab Members</a>
          <a href="gallery.html">Gallery</a>
          <a href="news.html">News</a>
          <a href="access.html">Access</a>
        </nav>

        <div class="home-message">
          ～現場実装を見据え実用化を最優先とする<span class="sp-br"></span>
          <span class="highlight-red">日本初</span>
          の
          <span class="highlight-red">建設DX研究室</span>
          ～
        </div>

        <!-- PC用 -->
        <p class="seo-intro pc-only">
          国士舘大学 建設DX研究室（平尾研究室）は、橋梁・インフラ構造物を対象として<br class="pc-br">
          AI、画像解析、3Dモデル活用による建設DXの研究・開発を行っています。<br class="pc-br">
          現場実装を見据え、実用化につながる研究・開発に特化しています。
        </p>
        
        <!-- スマホ用 -->
        <p class="seo-intro sp-only">
          橋梁・インフラ構造物を対象として、AI、画像解析、3Dモデル活用による建設DXの研究・開発を行っています。
        </p>

      </div>
    </div>
  </div>

</body>
</html>
