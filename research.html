<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research | KENSHO Lab</title>

  <style>
    :root{
      --bg:#0b1220;
      --ink:#0b1220;
      --glass: rgba(255,255,255,0.18);
      --glass-border: rgba(255,255,255,0.30);
      --shadow: 0 20px 70px rgba(0,0,0,0.25);
    }

    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color:#fff;
      overflow-x:hidden;
    }

    /* ===== 固定ヘッダー（全ページ共通） ===== */
    .topbar{
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 92vw);
      z-index: 50;

      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.25);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 6px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:#3ea6ff;
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }

    .nav{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav a{
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 999px;
      transition: .2s;
    }
    .nav a:hover{
      background: rgba(255,255,255,0.18);
    }
    .nav a.active{
      background: rgba(255,255,255,0.24);
      border: 1px solid rgba(255,255,255,0.22);
    }

    /* ===== ページ本体 ===== */
    .page{
      min-height: 100vh;
      padding-top: 100px; /* 固定ヘッダー分 */
      padding-bottom: 60px;
    }

    .hero{
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 22px 0 14px;
    }
    .kicker{
      opacity:.85;
      letter-spacing:.10em;
      font-weight:700;
      font-size: 13px;
    }
    h1{
      margin: 10px 0 8px;
      font-size: clamp(28px, 4.0vw, 46px);
      letter-spacing: .04em;
    }
    .lead{
      margin:0;
      opacity:.86;
      line-height:1.8;
      max-width: 72ch;
    }

    /* ===== インフラ都市：背景画像＋ホットスポット ===== */
    .city{
      width: min(1100px, 92vw);
      margin: 18px auto 0;

      position: relative;
      aspect-ratio: 16/9;
      border-radius: 22px;
      overflow: hidden;

      background: #111;
      background-image: url("https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E3%82%A4%E3%83%B3%E3%83%95%E3%83%A9%E9%83%BD%E5%B8%82.png");
      background-size: cover;
      background-position: center;

      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: var(--shadow);
    }

    /* 画像に薄いグラデ（上品にする） */
    .city::before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(11,18,32,0.10), rgba(11,18,32,0.55));
      pointer-events:none;
    }

    /* ホットスポット（橋の位置に置く） */
    .hotspot{
      position:absolute;
      left: 56%;
      top: 58%;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: rgba(62,166,255,0.22);
      border: 1px solid rgba(62,166,255,0.60);
      box-shadow: 0 0 0 10px rgba(62,166,255,0.12);
      cursor: pointer;
    }
    .hotspot::after{
      content:"";
      position:absolute; inset: 10px;
      border-radius: 999px;
      background: rgba(62,166,255,0.65);
      filter: blur(0.2px);
    }

    /* 吹き出し（ホバーで表示） */
    .bubble{
      position:absolute;
      left: 56%;
      top: 58%;
      transform: translate(-50%, calc(-100% - 18px));
      width: min(440px, 80vw);

      opacity: 0;
      visibility: hidden;
      transition: .18s;

      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.30);
      color: #fff;
      text-align: left;
    }

    .bubble::after{
      content:"";
      position:absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      border-width: 10px 10px 0 10px;
      border-style: solid;
      border-color: rgba(255,255,255,0.18) transparent transparent transparent;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
    }

    .bubble h3{
      margin: 0 0 8px;
      font-size: 16px;
      letter-spacing: .06em;
    }
    .bubble ul{
      margin: 0;
      padding-left: 18px;
      line-height: 1.8;
      opacity: .95;
      font-weight: 600;
    }

    /* ホバーで吹き出し表示 */
    .city:hover .bubble,
    .hotspot:hover + .bubble{
      opacity: 1;
      visibility: visible;
    }

    /* スマホで指でも見れるように：ホットスポットをタップしやすく */
    @media (max-width: 640px){
      .hotspot{ width: 54px; height: 54px; }
      .bubble{ width: min(520px, 92vw); }
    }
  </style>
</head>

<body>
  <!-- 固定ヘッダー -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>KENSHO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a class="active" href="research.html">Research</a>
      <a href="members.html">Lab Member</a>
      <a href="gallery.html">Gallery</a>
      <a href="news.html">News</a>
      <a href="access.html">Access</a>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <div class="kicker">RESEARCH</div>
      <h1>橋梁AI・建設DXの研究</h1>
      <p class="lead">
        インフラの現場課題に直結するAI技術を、データ・検証・実装まで一気通貫で扱います。
        （この文章は後であなたの文章に差し替え可能）
      </p>
    </section>

    <!-- インフラ都市イラスト＋ホットスポット -->
    <section class="city" aria-label="Infrastructure city illustration">
      <!-- 橋の位置に置く（位置は後で調整） -->
      <div class="hotspot" aria-label="Bridge hotspot"></div>

      <div class="bubble" role="note" aria-label="Bridge research topics">
        <h3>橋梁に関する研究テーマ</h3>
        <ul>
          <li>画像解析によるひび割れ・剥離検出</li>
          <li>点群／3Dモデルによる形状・変状解析</li>
          <li>構造ヘルスモニタリング（SHM）</li>
          <li>点検・診断のワークフローDX</li>
          <li>現場実装を見据えたモデル運用</li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
