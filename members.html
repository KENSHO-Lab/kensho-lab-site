<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Members | KENSHO Lab</title>

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(255,255,255,0.12);
      --glass-bright: rgba(255,255,255,0.18);
      --border: rgba(255,255,255,0.18);
      --shadow: 0 18px 60px rgba(0,0,0,0.25);
      --accent: #3ea6ff;
    }

    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(62,166,255,0.12), rgba(11,18,32,1) 55%);
      color:#fff;
      overflow-x:hidden;
    }

    /* ===== 固定ヘッダー（共通） ===== */
    .topbar{
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 92vw);
      z-index: 100;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:10px; padding-left: 6px;
      color:#fff; text-decoration:none; font-weight:800; letter-spacing:.04em;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:var(--accent);
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }
    .nav{ display:flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .nav a{
      text-decoration:none; color:#fff; font-weight:700; font-size: 14px;
      padding: 10px 12px; border-radius: 999px; transition: .2s;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }
    .nav a.active{ background: rgba(255,255,255,0.24); border: 1px solid rgba(255,255,255,0.22); }

    /* ===== ページ全体構成 ===== */
    .page-wrap{
      width: min(1100px, 92vw);
      margin: 100px auto 60px;
    }

    .kicker{ opacity:.85; letter-spacing:.10em; font-weight:700; font-size: 13px; }
    h1{ margin: 10px 0 40px; font-size: clamp(28px, 4.0vw, 44px); letter-spacing: .04em; }

    .section-title{
      font-size: 20px;
      font-weight: 800;
      margin: 60px 0 24px;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
      letter-spacing: 0.1em;
    }

    /* ===== メンバーグリッド ===== */
    .grid{
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    @media (max-width: 1100px){ .grid{ grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 820px){ .grid{ grid-template-columns: repeat(2, 1fr); } }

    /* 共通カードスタイル */
    .card{
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }

    /* 教員カード（クリック可能） */
    .faculty-link{
      text-decoration: none;
      color: inherit;
      display: block;
      width: fit-content;
      transition: 0.3s;
    }
    .faculty-link:hover{
      transform: translateY(-5px);
    }
    .faculty-link:hover .card{
      border-color: var(--accent);
      background: var(--glass-bright);
    }
    .boss-card{ width: 220px; } /* 教員は少し横幅を固定 */

    .photo{
      aspect-ratio: 4/5;
      background-color: rgba(255,255,255,0.05);
      background-size: cover;
      background-position: center;
    }
    .meta{ padding: 14px; line-height: 1.6; }
    .name{ font-weight: 900; font-size: 16px; margin: 0 0 6px; }
    .info-line{ margin: 0; opacity: 0.85; font-size: 12px; }
    .tag{ font-weight: 700; color: var(--accent); margin-right: 4px; }
    .click-hint{ margin-top: 8px; font-size: 11px; font-weight: 800; color: var(--accent); opacity: 0.9; }

    /* ===== アーカイブ（集合写真）セクション ===== */
    .archive-grid{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    @media (max-width: 640px){ .archive-grid{ grid-template-columns: 1fr; } }

    .archive-link{
      text-decoration: none;
      color: inherit;
      transition: 0.3s;
    }
    .archive-card{
      position: relative;
    }
    .archive-photo{
      aspect-ratio: 16/9; /* 集合写真は横長 */
      background-color: rgba(255,255,255,0.05);
      background-size: cover;
      background-position: center;
    }
    .archive-label{
      padding: 16px;
      font-weight: 900;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .archive-link:hover{ transform: translateY(-5px); }
    .archive-link:hover .card{ border-color: var(--accent); }

  </style>
</head>

<body>
  <!-- 固定ヘッダー -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>HIRAO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a class="active" href="members.html">Lab Members</a>
      <a href="gallery.html">Gallery</a>
      <a href="news.html">News</a>
      <a href="access.html">Access</a>
    </nav>
  </header>

  <main class="page-wrap">
    <div class="kicker">LAB MEMBERS</div>
    <h1>研究室メンバー</h1>

    <!-- 教員セクション -->
    <section>
      <div class="section-title">Faculty</div>

          <div class="meta">

        <article class="card">

          <div class="meta">
            <p class="name">メンバー氏名</p>
            <p class="info-line"><span class="tag">学年：</span>学部4年</p>
            <p class="info-line"><span class="tag">研究：</span>テーマ未定</p>
            <p class="info-line"><span class="tag">趣味：</span>読書</p>
          </div>
        </article>

        <!-- メンバー追加分（仮） -->
        <article class="card"><div class="photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png')"></div><div class="meta"><p class="name">メンバー氏名</p><p class="info-line"><span class="tag">学年：</span>学部4年</p><p class="info-line"><span class="tag">研究：</span>テーマ未定</p><p class="info-line"><span class="tag">趣味：</span>旅行</p></div></article>
        <article class="card"><div class="photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png')"></div><div class="meta"><p class="name">メンバー氏名</p><p class="info-line"><span class="tag">学年：</span>学部4年</p><p class="info-line"><span class="tag">研究：</span>テーマ未定</p><p class="info-line"><span class="tag">趣味：</span>スポーツ</p></div></article>
      </div>
    </section>

    <!-- アーカイブセクション（各期の集合写真） -->
    <section>
      <div class="section-title">Archives</div>
      <div class="archive-grid">
        <!-- 1期生アーカイブ -->
        <a href="members-1st.html" class="archive-link">
          <article class="card archive-card">
            <div class="archive-photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png')"></div>
            <div class="archive-label">
              <span>1期生</span>
              <span style="font-size: 14px; opacity: 0.6;">View Members →</span>
            </div>
          </article>
        </a>

        <!-- 2期生アーカイブ -->
        <a href="members-2nd.html" class="archive-link">
          <article class="card archive-card">
            <div class="archive-photo" style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/No_photo.png')"></div>
            <div class="archive-label">
              <span>2期生</span>
              <span style="font-size: 14px; opacity: 0.6;">View Members →</span>
            </div>
          </article>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
