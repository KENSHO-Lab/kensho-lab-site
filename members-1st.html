<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1期生 | 国士舘大学 建設DX研究室 (平尾研究室 Hirao Lab)</title>
  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.18);
      --shadow: 0 18px 60px rgba(0,0,0,0.25);
    }
    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(62,166,255,0.12), rgba(11,18,32,1) 55%);
      color:#fff;
      overflow-x:hidden;
    }

    .topbar{
      position: sticky;
      top: 12px;
      width: min(1100px, 92vw);
      margin: 12px auto 0;
      z-index: 50;

      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding-left: 6px;
      color:#fff; text-decoration:none;
      font-weight:800; letter-spacing:.04em; white-space:nowrap;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:#3ea6ff;
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }
    .nav{
      display:flex; gap: 8px; flex-wrap: wrap; justify-content:flex-end;
    }
    .nav a{
      text-decoration:none; color:#fff;
      font-weight:700; font-size: 14px;
      padding: 10px 12px; border-radius: 999px; transition:.2s;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }

    .wrap{
      width: min(1100px, 92vw);
      margin: 18px auto 40px;
    }
    .kicker{
      opacity:.85; letter-spacing:.10em; font-weight:700; font-size: 13px;
    }
    h1{
      margin: 10px 0 14px;
      font-size: clamp(28px, 4.0vw, 44px);
      letter-spacing: .04em;
    }

    /* 11名をPCでスクロール少なめで見せる：横5×2段＋1 くらい */
    .grid{
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    @media (max-width: 1100px){
      .grid{ grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 820px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }

    .card{
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow:hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.20);
    }
    .photo{
      aspect-ratio: 4/5;
      background: rgba(255,255,255,0.08);
      background-size: cover;
      background-position: center;
    }
    .meta{
      padding: 10px 12px 12px;
      line-height: 1.55;
    }
    .name{
      font-weight: 900;
      letter-spacing: .04em;
      margin: 0 0 4px;
      font-size: 15px;
    }
    .line{ margin: 0; opacity: .88; font-size: 12.5px; }
    .tag{ opacity:.95; font-weight:700; }

  @media (max-width: 640px) {
    .brand {
      display: none;
    }
  
    .topbar {
      justify-content: center;
      padding: 8px 10px;
    }
  
    .nav {
      width: 100%;
      justify-content: center;
      gap: 4px;
    }
  
    .nav a {
      font-size: 12px;
      padding: 8px 10px;
    }
  
    .wrap {
      margin-top: 40px;
    }
  
    .page-title {
      gap: 12px;
      margin-bottom: 28px;
    }
  
    .title-icon {
      width: 56px;
    }
  
    .page-title h1 {
      font-size: clamp(24px, 7vw, 32px);
    }
  }

  </style>
</head>

<body>

  </main>
</body>
