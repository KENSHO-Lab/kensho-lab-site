<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery | KENSHO Lab</title>

  <style>
    :root{
      --bg:#0b1220;
      --wall:#f3f0e9;
      --ink:#1a1a1a;
      --glass: rgba(255,255,255,0.14);
      --border: rgba(255,255,255,0.22);
      --shadow: 0 18px 60px rgba(0,0,0,0.25);
      --shadow2: 0 26px 90px rgba(0,0,0,0.22);
      --frame: rgba(25,25,25,0.85);
      --accent: rgba(62,166,255,0.95);
    }

    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow-x:hidden;
    }

    /* ===== 固定ヘッダー（他ページと統一） ===== */
    .topbar{
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 92vw);
      z-index: 50;

      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      color:#fff;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 6px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:#3ea6ff;
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }
    .nav{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav a{
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 999px;
      transition: .2s;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }
    .nav a.active{
      background: rgba(255,255,255,0.24);
      border: 1px solid rgba(255,255,255,0.22);
    }

    /* ===== 美術館ワールド ===== */
    .museum{
      min-height: 100vh;
      padding-top: 100px;
      padding-bottom: 64px;

      /* 背景：壁＋薄い陰影 */
      background:
        radial-gradient(circle at 30% 10%, rgba(255,255,255,0.10), rgba(0,0,0,0.55)),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.55)),
        var(--bg);
    }

    /* 壁の面（ここに内装画像を敷くことも可能） */
    .wall{
      width: min(1180px, 94vw);
      margin: 0 auto;
      border-radius: 26px;
      overflow:hidden;
      box-shadow: var(--shadow2);

      background:
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(244,240,233,0.92));
      background-image: url("MUSEUM_BG_URL");
      background-size: cover;
      background-position: center;
    }

    .wall-overlay{
      padding: 26px 22px 26px;
      background: rgba(243,240,233,0.80); /* 内装画像がある場合はこれで読みやすく */
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .header{
      width: min(1100px, 92vw);
      margin: 0 auto 18px;
      padding: 10px 0 6px;
    }
    .kicker{
      letter-spacing:.12em;
      font-weight:900;
      font-size: 12px;
      opacity:.75;
    }
    h1{
      margin: 10px 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .04em;
      font-weight: 900;
    }
    .lead{
      margin:0;
      opacity:.85;
      line-height:1.8;
      max-width: 80ch;
    }

    /* ===== アルバム展示（作品カード） ===== */
    .grid{
      width: min(1100px, 92vw);
      margin: 18px auto 8px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns: 1fr; }
    }

    .album{
      text-decoration:none;
      color: var(--ink);
      display:block;
    }

    .frame{
      background: rgba(255,255,255,0.65);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.14);
      border: 1px solid rgba(0,0,0,0.10);
      transition: .22s;
    }

    /* 作品（代表写真） */
    .art{
      border-radius: 16px;
      overflow:hidden;
      background: #ddd;
      aspect-ratio: 4/3;
      position: relative;
      border: 8px solid rgba(25,25,25,0.85);  /* 額縁 */
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      background-size: cover;
      background-position: center;
    }

    /* ラベル（作品名風） */
    .label{
      margin: 12px 0 0;
      text-align: center;
      letter-spacing: .08em;
      font-weight: 900;
      font-size: 15px;
    }
    .sub{
      margin: 6px 0 0;
      text-align: center;
      opacity: .78;
      font-size: 12.5px;
      font-weight: 700;
    }

    /* hoverで美術館っぽく“近づく” */
    .album:hover .frame{
      transform: translateY(-3px);
      box-shadow: 0 30px 90px rgba(0,0,0,0.18);
    }
    .album:hover .art{
      filter: saturate(1.05) contrast(1.02);
    }
    .title-icon{
      width: 70px;
      height: auto;
      opacity: 0.9;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.25));
    }
    
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>HIRAO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>

  <main class="museum">

        研究室ミュージアム
        </h1>
          <p class="lead">のぞきたい作品を選択してください。</p>
        </div>

    <section class="grid" aria-label="Album grid"> 
          <a class="album" href="gallery-lab-daily.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">普段の研究室</div>
              <div class="sub">Daily Lab Life</div>
            </div>
          </a>

          <a class="album" href="gallery-thesis.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">卒論・修論発表会</div>
              <div class="sub">Thesis Presentation</div>
            </div>
          </a>

          <a class="album" href="gallery-events.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">研究室イベント</div>
              <div class="sub">Lab Events</div>
            </div>
          </a>

          <a class="album" href="gallery-news.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">過去のNews写真</div>
              <div class="sub">News Archive</div>
            </div>
          </a>

          <a class="album" href="gallery-field.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">現場・実験</div>
              <div class="sub">Field & Experiments</div>
            </div>
          </a>

          <a class="album" href="gallery-collab.html">
            <div class="frame">
              <div class="art" style="background-image:url('');"></div>
              <div class="label">メンバーの趣味</div>

            </div>
          </a>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
