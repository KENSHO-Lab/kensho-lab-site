<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>過去のNews写真 | Gallery | 国士舘大学 建設DX研究室 (平尾研究室 Hirao Lab)</title>

  <style>
    :root{
      --bg:#0b1220;
      --shadow: 0 18px 60px rgba(0,0,0,0.25);
    }
    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), rgba(11,18,32,1) 55%),
        var(--bg);
      overflow-x:hidden;
    }

    .topbar{
      position: sticky;
      top: 12px;
      width: min(1100px, 92vw);
      margin: 12px auto 0;
      z-index: 50;

      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }

    .brand-dot{
      width:10px;height:10px;border-radius:999px;
      background:#3ea6ff;
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }

    .nav{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav a{
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 999px;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }
    .nav a.active{
      background: rgba(255,255,255,0.24);
    }

    .wrap{
      width: min(1100px, 92vw);
      margin: 18px auto 44px;
    }

    .kicker{
      letter-spacing:.12em;
      font-weight:900;
      font-size: 12px;
      opacity:.85;
    }

    h1{
      margin: 10px 0 6px;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 900;
    }

    .lead{
      margin:0;
      opacity:.86;
    }

    .grid{
      margin-top: 18px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }

    .tile{
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow:hidden;
    }

    .photo{
      aspect-ratio: 4/3;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      transition: 0.25s;
    }

    .photo:hover{
      transform: scale(1.03);
    }

    .cap{
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
    }

    /* モーダル */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items:center;
      justify-content:center;
      z-index: 2000;
    }

    .lightbox.active{
      display:flex;
    }

    .lightbox img{
      max-width: 90%;
      max-height: 85%;
      border-radius: 14px;
    }

    .lightbox-close{
      position:absolute;
      top:20px;
      right:30px;
      font-size:40px;
      cursor:pointer;
    }

  @media (max-width: 640px) {
    .brand {
      display: none;
    }
  
    .topbar {
      justify-content: center;
      padding: 8px 10px;
    }
  
    .nav {
      width: 100%;
      justify-content: center;
      gap: 4px;
    }
  
    .nav a {
      font-size: 12px;
      padding: 8px 10px;
    }
  
    .wrap {
      margin-top: 40px;
    }
  
    .page-title {
      gap: 12px;
      margin-bottom: 28px;
    }
  
    .title-icon {
      width: 56px;
    }
  
    .page-title h1 {
      font-size: clamp(24px, 7vw, 32px);
    }
  }
    
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-dot"></span>HIRAO Lab
  </a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="research.html">Research</a>
    <a href="members.html">Lab Members</a>
    <a class="active" href="gallery.html">Gallery</a>
    <a href="news.html">News</a>
    <a href="access.html">Access</a>
  </nav>
</header>

<main class="wrap">
  <div class="kicker">GALLERY</div>
  <h1>過去のNews写真</h1>
  <p class="lead">過去に投稿したNews写真の一覧です</p>

  <section class="grid">

    <!-- ① -->
    <article class="tile">
      <div class="photo"
           data-full="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/HP_Home1.png"
           style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/HP_Home1.png');"></div>
      <div class="cap">平尾研究室ホームページ始動</div>
    </article>

    <!-- ② -->
    <article class="tile">
      <div class="photo"
           data-full="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E5%B9%B3%E5%B0%BE%E8%B3%A2%E7%94%9F_%E3%83%97%E3%83%AD%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E5%86%99%E7%9C%9F1.jpg"
           style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E5%B9%B3%E5%B0%BE%E8%B3%A2%E7%94%9F_%E3%83%97%E3%83%AD%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E5%86%99%E7%9C%9F1.jpg');"></div>
      <div class="cap">平尾先生ご着任</div>
    </article>

    <article class="tile">
      <div class="photo"
           data-full="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E5%B9%B3%E5%B0%BE%E7%A0%941%E6%9C%9F%E7%94%9F_1.JPG"
           style="background-image:url('https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E5%B9%B3%E5%B0%BE%E7%A0%941%E6%9C%9F%E7%94%9F_1.JPG');"></div>
      <div class="cap">2026年度初回ミーティング</div>
    </article>

  </section>
</main>

<!-- モーダル -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="close">&times;</span>
  <img id="img">
</div>

<script>
const photos = document.querySelectorAll('.photo');
const lightbox = document.getElementById('lightbox');
const img = document.getElementById('img');
const close = document.getElementById('close');

photos.forEach(p => {
  p.onclick = () => {
    if(!p.dataset.full) return;
    img.src = p.dataset.full;
    lightbox.classList.add('active');
  };
});

close.onclick = () => {
  lightbox.classList.remove('active');
};

lightbox.onclick = (e) => {
  if(e.target === lightbox){
    lightbox.classList.remove('active');
  }
};
</script>

</body>
</html>
