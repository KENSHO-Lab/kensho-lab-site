<!doctype html>
<html lang="ja">
<head>
  <!-- (前のCSSはそのまま、以下を追加・修正) -->
  <style>
    /* ... 既存のスタイル ... */
    
    /* 確認画面用のスタイル */
    .confirm-text { display: none; font-size: 16px; line-height: 1.6; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .is-confirm .form-input { display: none; } /* 確認中は入力欄を隠す */
    .is-confirm .confirm-text { display: block; } /* 確認中はテキストを出す */
    
    .btn-group { display: flex; gap: 12px; margin-top: 30px; }
    .back-btn { 
      flex: 1; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-weight: 800;
    }
    .submit-btn { flex: 2; }
    
    #backButton { display: none; } /* 初期状態では隠す */
  </style>
</head>
<body>

  <!-- (ヘッダーは共通) -->

  <main class="wrap">
    <div class="page-title">
      <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E7%A0%94%E7%A9%B6%E5%AE%A4%E3%83%AD%E3%82%B4_%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB2.png" alt="KENSHO Lab" class="title-icon">
      <h1>お問い合わせ</h1>
    </div>

    <div class="form-container">
      <form id="contactForm" action="https://formsubmit.co/kensho.h@kokushikan.ac.jp" method="POST">
        
        <!-- 送信後の完了ページ指定（重要） -->
        <input type="hidden" name="_next" value="https://main.d24snd0warhreg.amplifyapp.com/thanks.html">
        <input type="hidden" name="_subject" value="【研究室サイト】新規お問い合わせ">
        <!-- FormSubmitの確認画面を飛ばす設定 -->
        <input type="hidden" name="_captcha" value="false">

        <div class="form-group">
          <label>お名前<span class="required-tag">必須</span></label>
          <input type="text" name="お名前" id="input_name" class="form-input" placeholder="国士 太郎" required>
          <div class="confirm-text" id="text_name"></div>
        </div>

        <div class="form-group">
          <label>ご所属<span class="required-tag">必須</span></label>
          <input type="text" name="所属" id="input_org" class="form-input" required>
          <div class="confirm-text" id="text_org"></div>
        </div>

        <div class="form-group">
          <label>メールアドレス<span class="required-tag">必須</span></label>
          <input type="email" name="email" id="input_email" class="form-input" required>
          <div class="confirm-text" id="text_email"></div>
        </div>

        <div class="form-group">
          <label>お問い合わせ項目<span class="required-tag">必須</span></label>
          <select name="項目" id="input_subject" class="form-input" required>
            <option value="" disabled selected>選択してください</option>
            <option value="共同研究のご相談">共同研究のご相談</option>
            <option value="メディア出演のご依頼">メディア出演のご依頼</option>
            <option value="出前講義のご依頼">出前講義のご依頼</option>
            <option value="講演会出演のご依頼">講演会出演のご依頼</option>
            <option value="研究室見学会">研究室見学</option>
            <option value="その他">その他</option>
          </select>
          <div class="confirm-text" id="text_subject"></div>
        </div>

        <div class="form-group">
          <label>お問い合わせ内容<span class="required-tag">必須</span></label>
          <textarea name="内容" id="input_message" class="form-input" rows="8" maxlength="500" required></textarea>
          <div class="confirm-text" id="text_message" style="white-space: pre-wrap;"></div>
        </div>

        <div class="btn-group">
          <button type="button" id="backButton" class="back-btn" onclick="goBack()">修正する</button>
          <button type="button" id="actionButton" class="submit-btn" style="background:var(--accent); color:#0b1220; border:none; border-radius:12px; font-weight:900; cursor:pointer;" onclick="goConfirm()">内容を確認する</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const actionButton = document.getElementById('actionButton');
    const backButton = document.getElementById('backButton');
    const container = document.querySelector('.form-container');

    // 「内容を確認する」ボタンを押したとき
    function goConfirm() {
      // 入力バリデーションチェック
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // 入力値をテキスト表示用にコピー
      document.getElementById('text_name').innerText = document.getElementById('input_name').value;
      document.getElementById('text_org').innerText = document.getElementById('input_org').value;
      document.getElementById('text_email').innerText = document.getElementById('input_email').value;
      document.getElementById('text_subject').innerText = document.getElementById('input_subject').value;
      document.getElementById('text_message').innerText = document.getElementById('input_message').value;

      // 表示の切り替え
      container.classList.add('is-confirm');
      backButton.style.display = 'block';
      actionButton.innerText = '送信する';
      actionButton.onclick = function() { form.submit(); }; // 次のクリックで送信
    }

    // 「修正する」ボタンを押したとき
    function goBack() {
      container.classList.remove('is-confirm');
      backButton.style.display = 'none';
      actionButton.innerText = '内容を確認する';
      actionButton.onclick = goConfirm;
    }
  </script>
</body>
</html>
