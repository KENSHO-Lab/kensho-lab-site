<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研究室のホームページが始動しました。 | News | KENSHO Lab</title>

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.18);
      --shadow: 0 18px 60px rgba(0,0,0,0.35);
      --accent: #3ea6ff;
    }

    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color:#fff;
      overflow: hidden; /* 画面全体のスクロールは禁止 */
    }

    /* ===== 固定ヘッダー（共通） ===== */
    .topbar{
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 92vw);
      z-index: 100;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:10px; padding-left: 6px;
      color:#fff; text-decoration:none; font-weight:800; letter-spacing:.04em;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:999px;background:var(--accent);
      box-shadow: 0 0 0 6px rgba(62,166,255,0.18);
    }
    .nav{ display:flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .nav a{
      text-decoration:none; color:#fff; font-weight:700; font-size: 14px;
      padding: 10px 12px; border-radius: 999px; transition: .2s;
    }
    .nav a:hover{ background: rgba(255,255,255,0.18); }

    /* ===== メインレイアウト ===== */
    .detail-container{
      display: flex;
      height: 100vh;
      padding-top: 80px; /* ヘッダー分 */
      box-sizing: border-box;
    }

    /* --- 左側：写真スクロールエリア --- */
    .visual-side{
      flex: 1.2;
      position: relative;
      margin: 20px;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
    }

    /* 固定ロゴ：写真がスクロールしても動かない */
    .lab-news-logo{
      position: absolute;
      top: 0;
      left: 0;
      width: 140px;
      z-index: 20;
      pointer-events: none;
    }

    /* 写真が縦に並ぶスクロールコンテナ */
    .photo-scroller{
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: none;
    }
/* スクロールバー全体 */
.photo-scroller::-webkit-scrollbar {
  width: 10px;
}

/* 背景（トラック） */
.photo-scroller::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}

/* つまみ部分 */
.photo-scroller::-webkit-scrollbar-thumb {
  background: rgba(62,166,255,0.7);
  border-radius: 10px;
  border: 2px solid rgba(11,18,32,0.8);
}

/* ホバー時（さらに見やすく） */
.photo-scroller::-webkit-scrollbar-thumb:hover {
  background: rgba(62,166,255,1);
}

    .photo-scroller img{
      width: 100%;
      display: block;
      object-fit: cover;
      scroll-snap-align: start;
    }

    /* --- 右側：記事本文エリア --- */
    .content-side{
      flex: 1;
      padding: 40px 60px 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .date{
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    h1{
      font-size: clamp(24px, 2.5vw, 36px);
      font-weight: 900;
      line-height: 1.4;
      margin: 0 0 30px 0;
      letter-spacing: 0.04em;
    }

    .article-body{
      font-size: 17px;
      line-height: 1.8;
      opacity: 0.9;
      font-weight: 500;
    }

    .back-btn{
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      opacity: 0.6;
      transition: 0.3s;
    }
    .back-btn:hover{
      opacity: 1;
      color: var(--accent);
    }

    /* --- レスポンシブ --- */
    @media (max-width: 960px){
      body { overflow-y: auto; }
      .detail-container { flex-direction: column; height: auto; }
      .visual-side { height: 60vh; flex: none; }
      .content-side { padding: 40px 20px; flex: none; }
      .lab-news-logo { width: 100px; }
    }

    @media (max-width: 640px) {
      .brand {
        display: none;
      }
    
      .topbar {
        justify-content: center;
        padding: 8px 10px;
      }
    
      .nav {
        width: 100%;
        justify-content: center;
        gap: 4px;
      }
    
      .nav a {
        font-size: 12px;
        padding: 8px 10px;
      }
    
      .wrap {
        margin-top: 50px;
      }
    
      .page-title {
        gap: 12px;
        margin-bottom: 28px;
      }
    
      .title-icon {
        width: 56px;
      }
    
      .page-title h1 {
        font-size: clamp(24px, 7vw, 32px);
      }
    }
    
  </style>
</head>

<body>
  <!-- 固定ヘッダー -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>HIRAO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="members.html">Lab Members</a>
      <a href="gallery.html">Gallery</a>
      <a href="news.html">News</a>
      <a href="access.html">Access</a>
    </nav>
  </header>

  <main class="detail-container">
    <!-- 左側：写真セクション -->
    <section class="visual-side">
      <!-- 固定ロゴ -->
      <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/LAB_NEWS.png" alt="LAB NEWS" class="lab-news-logo">
      
      <!-- 写真エリア -->
      <div class="photo-scroller">
        <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/HP_Home1.png" alt="ホームページ始動">
      </div>
    </section>

    <!-- 右側：テキストセクション -->
    <section class="content-side">
      <div class="date">2026.04.01</div>
      <h1>研究室のホームページが始動しました。</h1>
      
      <div class="article-body">
        <p>
          平尾賢生先生が国士舘大学にご着任され、研究室のホームページを開設しました。
        </p>
        <p>
          研究活動や研究室の様子など定期的に更新していく予定です。
        </p>
        <p>
          今後とも、建設DX研究室をよろしくお願いいたします。
        </p>
      </div>

      <!-- 戻るボタン -->
      <a href="news.html" class="back-btn">
        <span>←</span> News一覧に戻る
      </a>
    </section>
  </main>

</body>
</html>
