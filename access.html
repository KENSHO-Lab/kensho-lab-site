<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access | KENSHO Lab</title>

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(255,255,255,0.07);
      --glass-bright: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.15);
      --shadow: 0 20px 60px rgba(0,0,0,0.4);
      --accent: #3ea6ff;
      --univ-red: #b02127;
    }

    body{
      margin:0;
      font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color:#fff;
      overflow-x:hidden;
      /* 背景にうっすらグリッド模様を入れてAI感を演出 */
      background-image: 
        linear-gradient(rgba(62, 166, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 166, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ===== 固定ヘッダー（共通） ===== */
    .topbar{
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      width: min(1100px, 92vw);
      z-index: 100;
      display:flex; align-items:center; justify-content: space-between;
      padding: 10px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{ display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-weight:800; }
    .brand-dot{ width:10px; height:10px; border-radius:999px; background:var(--accent); box-shadow: 0 0 0 6px rgba(62,166,255,0.18); }
    .nav{ display:flex; gap: 8px; }
    .nav a{ text-decoration:none; color:#fff; font-weight:700; font-size: 14px; padding: 10px 12px; border-radius: 999px; transition: .2s; }
    .nav a:hover{ background: rgba(255,255,255,0.18); }
    .nav a.active{ background: rgba(255,255,255,0.24); border: 1px solid rgba(255,255,255,0.22); }

    /* ===== メインコンテンツ ===== */
    .wrap{
      width: min(1200px, 94vw);
      margin: 120px auto 60px;
    }

    .page-title {
      display: flex; align-items: center; gap: 16px; margin-bottom: 40px;
    }
    .page-title h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 900; letter-spacing: 0.05em; }
    .title-icon { width: 70px; height: auto; filter: drop-shadow(0 8px 22px rgba(0,0,0,0.25)); }

    /* ダッシュボードレイアウト */
    .access-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 30px;
      align-items: start;
    }

    /* --- 左側：サイバーマップエリア --- */
    .map-container {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      aspect-ratio: 16 / 10;
      background: #000;
    }

    /* Google MapsをAIっぽく色反転させる魔法のCSS */
    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: grayscale(1) invert(90%) hue-rotate(180deg) brightness(0.9) contrast(1.2);
      opacity: 0.8;
    }

    /* マップ上のHUD装飾 */
    .map-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 20px solid transparent;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
    }
    .scan-line {
      position: absolute;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      top: 0;
      animation: scan 4s linear infinite;
      opacity: 0.3;
    }
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    /* --- 右側：インフォメーションパネル --- */
    .info-side {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-label::before { content: ""; width: 8px; height: 8px; background: var(--univ-red); border-radius: 2px; }

    .card-content {
      font-size: 15px;
      line-height: 1.8;
      font-weight: 500;
    }
    .address-main {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .tel-link {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .station-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .time-tag {
      display: inline-block;
      background: var(--univ-red);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* レスポンシブ */
    @media (max-width: 1000px) {
      .access-grid { grid-template-columns: 1fr; }
      .map-container { aspect-ratio: 1 / 1; }
    }
  </style>
</head>

<body>
  <!-- 固定ヘッダー -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>HIRAO Lab</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="members.html">Lab Members</a>
      <a href="gallery.html">Gallery</a>
      <a href="news.html">News</a>
      <a class="active" href="access.html">Access</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="page-title">
      <img src="https://kensho-lab-assets.s3.ap-northeast-1.amazonaws.com/%E7%A0%94%E7%A9%B6%E5%AE%A4%E3%83%AD%E3%82%B4_%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB2.png" alt="KENSHO Lab" class="title-icon">
      <h1>アクセス</h1>
    </div>

    <div class="access-grid">
      <!-- 左側：Google Map -->
      <section class="map-container">
        <!-- 
          Google Maps Embed API 
          提供されたURLに基づき、国士舘大学世田谷キャンパスを表示
        -->
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m12!1m3!1d3242.234327293156!2d139.65155707635957!3d35.64787813154868!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018f379b20df41f%3A0xfbeff0750a61cafe!2z5Zu95aOr6aSo5aSn5a2m!5e0!3m2!1sja!2sjp!4v1711080000000!5m2!1sja!2sjp" 
          allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
        
        <!-- HUD装飾（走査線アニメーション） -->
        <div class="map-hud">
          <div class="scan-line"></div>
        </div>
      </section>

      <!-- 右側：詳細情報 -->
      <aside class="info-side">
        <!-- 所在地 -->
        <div class="info-card">
          <div class="card-label">LOCATION DATA</div>
          <div class="card-content">
            <div class="address-main">国士舘大学 世田谷キャンパス</div>
            〒154-8515<br>
            東京都世田谷区世田谷4-28-1<br>
            7号館 4階 719号室（建設DX研究室）
          </div>
        </div>

        <!-- 連絡先 -->
        <div class="info-card">
          <div class="card-label">CONTACT CHANNEL</div>
          <div class="card-content">
            <a href="tel:0354815848" class="tel-link">03-5481-5848</a>
          </div>
        </div>

        <!-- 交通アクセス -->
        <div class="info-card">
          <div class="card-label">TRANSPORTATION</div>
          <div class="card-content">
            <div class="station-box">
              <span class="time-tag">6 MIN WALK</span><br>
              東急世田谷線「松陰神社前駅」または「世田谷駅」下車
            </div>
            <div style="margin-top: 10px; font-size: 12px; opacity: 0.6;">
              ※小田急線梅ヶ丘駅からも徒歩圏内です。
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

</body>
</html>
